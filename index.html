<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pharma Product Label Scanner</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f0f4f8;
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      padding: 25px 0;
    }
    .card {
      border-radius: 12px;
      border: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    #videoElement {
      width: 100%;
      height: auto;
      max-height: 300px;
      border-radius: 8px;
      background: #000;
      object-fit: cover;
    }
    #canvasElement {
      display: none;
    }
    .result-card {
      background: #ffffff;
      border-left: 5px solid #0d6efd;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Title -->
  <div class="text-center mb-4">
    <h3 class="fw-bold text-primary">💊 Pharma Product Label Scanner</h3>
    <p class="text-muted">औषधाचा बॉक्स किंवा स्ट्रिप कॅमेऱ्यासमोर धरा आणि एका क्लिकवर सर्व माहिती मिळवा</p>
  </div>

  <div class="row g-4 justify-content-center">
    <!-- १. कॅमेरा व अपलोड विभाग -->
    <div class="col-md-6 col-lg-5">
      <div class="card p-3 text-center">
        <h6 class="fw-bold mb-2">📷 Live Camera Scanner</h6>
        
        <video id="videoElement" autoplay playsinline></video>
        <canvas id="canvasElement"></canvas>

        <div class="d-grid gap-2 mt-3">
          <button id="startCamBtn" class="btn btn-outline-secondary btn-sm" onclick="startCamera()">कॅमेरा सुरू करा</button>
          <button id="captureBtn" class="btn btn-primary fw-bold" onclick="captureAndScan()" disabled>
            <span id="btnSpinner" class="spinner-border spinner-border-sm me-2 d-none" role="status"></span>
            <span id="btnText">📸 फोटो काढा आणि स्कॅन करा</span>
          </button>
        </div>

        <div class="mt-3">
          <label class="form-label small text-muted">किंवा गॅलरीमधून प्रॉडक्टचा फोटो निवडा:</label>
          <input type="file" id="fileInput" class="form-control form-control-sm" accept="image/*" onchange="handleFileSelect(event)">
        </div>

        <div id="statusAlert" class="alert mt-3 d-none" role="alert"></div>
      </div>
    </div>

    <!-- २. स्कॅन झालेला डेटा दाखवणारा फॉर्म -->
    <div class="col-md-6 col-lg-6">
      <div class="card p-4 result-card">
        <h5 class="fw-bold text-dark mb-3">🔍 प्रॉडक्टची तपशीलवार माहिती</h5>
        
        <form id="productForm">
          <div class="mb-2">
            <label class="form-label fw-semibold text-secondary">औषधाचे नाव (Brand Name)</label>
            <input type="text" id="brand_name" class="form-control" placeholder="उदा. Dolo 650">
          </div>

          <div class="mb-2">
            <label class="form-label fw-semibold text-secondary">कंटेंट / घटक (Composition)</label>
            <input type="text" id="composition" class="form-control" placeholder="उदा. Paracetamol 650mg">
          </div>

          <div class="row g-2 mb-2">
            <div class="col-6">
              <label class="form-label fw-semibold text-secondary">किंमत (MRP ₹)</label>
              <input type="number" step="0.01" id="mrp" class="form-control text-success fw-bold" placeholder="0.00">
            </div>
            <div class="col-6">
              <label class="form-label fw-semibold text-secondary">बॅच क्र. (Batch No)</label>
              <input type="text" id="batch_no" class="form-control" placeholder="B123">
            </div>
          </div>

          <div class="row g-2 mb-2">
            <div class="col-6">
              <label class="form-label fw-semibold text-secondary">Mfg Date</label>
              <input type="text" id="mfg_date" class="form-control" placeholder="MM/YY">
            </div>
            <div class="col-6">
              <label class="form-label fw-semibold text-danger">Exp Date</label>
              <input type="text" id="exp_date" class="form-control" placeholder="MM/YY">
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold text-secondary">कंपनीचे नाव (Manufacturer)</label>
            <input type="text" id="manufacturer" class="form-control" placeholder="उदा. Cipla Ltd">
          </div>

          <button type="button" class="btn btn-success w-100 fw-bold" onclick="alert('डेटा सेव्ह झाला!')">💾 डेटा सेव्ह करा</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  // नवीन Deploy झालेली URL
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx8uhN9m-zXxOR4F4TBxUHF-4TMyPHYBxZ-EZq9odsFP0AaGm3xZLUD5P73JujUvIga/exec";

  const video = document.getElementById('videoElement');
  const canvas = document.getElementById('canvasElement');
  let currentBase64 = "";

  // १. कॅमेरा चालू करणे
  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: "environment" } // मोबाईलवर बॅक कॅमेरा वापरण्यासाठी
      });
      video.srcObject = stream;
      document.getElementById('captureBtn').disabled = false;
      showAlert("कॅमेरा सुरू झाला आहे. प्रॉडक्ट समोर धरा.", "success");
    } catch (err) {
      showAlert("कॅमेरा अ‍ॅक्सेस मिळाला नाही: " + err.message, "danger");
    }
  }

  // २. कॅमेऱ्यातून फोटो काढून AI ला पाठवणे
  function captureAndScan() {
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    const context = canvas.getContext('2d');
    context.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    const dataUrl = canvas.toDataURL('image/jpeg');
    currentBase64 = dataUrl.split(',')[1];

    sendToAI(currentBase64, "image/jpeg");
  }

  // ३. गॅलरीतून फोटो निवडल्यास
  function handleFileSelect(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      currentBase64 = e.target.result.split(',')[1];
      sendToAI(currentBase64, file.type || "image/jpeg");
    };
    reader.readAsDataURL(file);
  }

  // ४. Apps Script Web App कडे इमेज पाठवणे
  async function sendToAI(base64Data, mimeType) {
    setLoading(true);
    showAlert("Gemini AI प्रॉडक्टवरील लेबल वाचत आहे...", "info");

    try {
      const response = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ image: base64Data, mimeType: mimeType })
      });

      const result = await response.json();
      setLoading(false);

      if (result.success) {
        showAlert("माहिती यशस्वीरित्या मिळवली!", "success");
        fillForm(result.data);
      } else {
        showAlert("त्रुटी: " + result.error, "danger");
      }
    } catch (err) {
      setLoading(false);
      showAlert("कनेक्शन एरर: " + err.message, "danger");
    }
  }

  // ५. फॉर्ममध्ये माहिती भरणे
  function fillForm(data) {
    document.getElementById('brand_name').value = data.brand_name || '';
    document.getElementById('composition').value = data.composition || '';
    document.getElementById('mrp').value = data.mrp || 0;
    document.getElementById('batch_no').value = data.batch_no || '';
    document.getElementById('mfg_date').value = data.mfg_date || '';
    document.getElementById('exp_date').value = data.exp_date || '';
    document.getElementById('manufacturer').value = data.manufacturer || '';
  }

  function setLoading(isLoading) {
    const btn = document.getElementById("captureBtn");
    const spinner = document.getElementById("btnSpinner");
    const btnText = document.getElementById("btnText");

    btn.disabled = isLoading;
    if (isLoading) {
      spinner.classList.remove("d-none");
      btnText.textContent = " स्कॅन सुरू आहे...";
    } else {
      spinner.classList.add("d-none");
      btnText.textContent = "📸 फोटो काढा आणि स्कॅन करा";
    }
  }

  function showAlert(message, type) {
    const alertBox = document.getElementById("statusAlert");
    alertBox.className = `alert alert-${type} mt-2 py-2`;
    alertBox.textContent = message;
    alertBox.classList.remove("d-none");
  }

  // पेज ओपन होताच आपोआप कॅमेरा स्टार्ट करणे
  window.onload = startCamera;
</script>

</body>
</html>
