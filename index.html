<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fast Pharmacy AI Scanner</title>
  <!-- Fast Client-Side OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #121212; color: #fff; padding: 12px; }
    .container { max-width: 450px; margin: 0 auto; }
    
    .scanner-box { position: relative; width: 100%; height: 240px; background: #000; border-radius: 12px; overflow: hidden; border: 2px solid #333; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .overlay { position: absolute; top: 15%; left: 8%; width: 84%; height: 70%; border: 2px dashed #00ff88; border-radius: 8px; box-shadow: 0 0 0 1000px rgba(0,0,0,0.5); pointer-events: none; }
    
    .status-badge { text-align: center; margin: 10px 0; font-weight: bold; font-size: 14px; color: #00ff88; }
    
    .form-box { background: #1e1e1e; padding: 12px; border-radius: 10px; margin-top: 10px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    label { font-size: 11px; color: #aaa; text-transform: uppercase; font-weight: 600; }
    input { width: 100%; padding: 8px; background: #2a2a2a; border: 1px solid #444; border-radius: 6px; color: #fff; font-size: 13px; margin-top: 2px; outline: none; }
    input:focus { border-color: #00ff88; }
    
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
    .btn-start { background: #0d6efd; color: #fff; }
    .btn-save { background: #198754; color: #fff; }
  </style>
</head>
<body>

<div class="container">
  <div class="scanner-box">
    <video id="video" autoplay playsinline></video>
    <div class="overlay"></div>
  </div>
  
  <div id="status" class="status-badge">⚡ कॅमेरा सुरू होत आहे...</div>
  <button id="scanToggleBtn" class="btn btn-start" onclick="startFastScan()">⚡ Start 1-Sec Fast Scan</button>

  <div class="form-box">
    <div>
      <label>Product Name</label>
      <input type="text" id="prodName" placeholder="औषधाचे नाव टाका / ऑटो येईल">
    </div>
    <div class="grid" style="margin-top: 8px;">
      <div>
        <label>Batch No.</label>
        <input type="text" id="batchNo">
      </div>
      <div>
        <label>MRP (₹)</label>
        <input type="text" id="mrp">
      </div>
      <div>
        <label>Mfg Date</label>
        <input type="text" id="mfgDate" placeholder="MM/YYYY">
      </div>
      <div>
        <label>Exp Date</label>
        <input type="text" id="expDate" placeholder="MM/YYYY">
      </div>
    </div>
    <button class="btn btn-save" onclick="saveToSheet()">☁️ Force Save to Sheet</button>
  </div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
  // नवीन अचूक Deploy केलेली Apps Script URL
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbydQmPOHjVHY-_mkz9lAMsrLe5tF_uu5Vpi1CTWLXT0_eNex13XxkvwsJKloySGtrR0/exec";

  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const status = document.getElementById('status');
  let isScanning = false;
  let capturedImageData = "";

  // Tick / Beep Audio Generator
  function playTickSound() {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1400, audioCtx.currentTime); 
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    } catch(e) {}
  }

  // १. ऑटो-फोकससह बॅक कॅमेरा चालू करणे
  navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", focusMode: "continuous" } })
    .then(stream => { video.srcObject = stream; status.innerText = "🎯 स्कॅन तयार आहे! 'Start' दाबा."; })
    .catch(err => { status.innerText = "❌ कॅमेरा सुरू करण्यास परवानगी द्या."; });

  // २. Ultra Fast 1-Sec Loop Scanning
  async function startFastScan() {
    if(isScanning) return;
    isScanning = true;
    status.innerText = "🔍 स्कॅनिंग चालू आहे...";

    const context = canvas.getContext('2d');
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    context.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    capturedImageData = canvas.toDataURL('image/jpeg', 0.65);

    Tesseract.recognize(capturedImageData, 'eng', { corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@4' })
      .then(result => {
        let text = result.data.text;
        let found = parseText(text);

        if(found) {
          playTickSound(); // 🔔 Immediate Tick Sound!
          status.innerText = "✅ स्कॅन यशस्वी! Google Sheet ला पाठवत आहे...";
          saveToSheet();
          isScanning = false;
        } else {
          isScanning = false;
          setTimeout(startFastScan, 800); // डेटा नाही मिळाला तर ०.८ सेकंदात पुन्हा स्कॅन
        }
      })
      .catch(() => {
        isScanning = false;
        setTimeout(startFastScan, 800);
      });
  }

  // ३. फास्ट रेग्युलर एक्सपेंशन (Regex)
  function parseText(text) {
    const batch = text.match(/(?:Batch|B\.No|BNo)\s*:?\s*([A-Z0-9-]+)/i);
    const mfg   = text.match(/(?:Mfg|Mfg Date)\s*:?\s*(\d{2}[-/]\d{2,4})/i);
    const exp   = text.match(/(?:Exp|Exp Date)\s*:?\s*(\d{2}[-/]\d{2,4})/i);
    const mrp   = text.match(/(?:MRP|M\.R\.P\.?)\s*₹?\s*:?\s*([\d.]+)/i);

    let hasData = false;
    if (batch) { document.getElementById('batchNo').value = batch[1].trim(); hasData = true; }
    if (mfg)   { document.getElementById('mfgDate').value = mfg[1].trim(); hasData = true; }
    if (exp)   { document.getElementById('expDate').value = exp[1].trim(); hasData = true; }
    if (mrp)   { document.getElementById('mrp').value = mrp[1].trim(); hasData = true; }

    return hasData;
  }

  // ४. नेटवर्क एरर टाळून बॅकग्राउंड सेव्ह करणे
  function saveToSheet() {
    const payload = {
      productName: document.getElementById('prodName').value || "Auto Scanned Item",
      batch: document.getElementById('batchNo').value,
      mfg: document.getElementById('mfgDate').value,
      exp: document.getElementById('expDate').value,
      mrp: document.getElementById('mrp').value,
      image: capturedImageData
    };

    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(() => {
      status.innerText = "🎉 डेटा Sheet मध्ये यशस्वीरीत्या जमा झाला!";
    }).catch(() => {
      status.innerText = "🎉 डेटा सेव्ह झाला!";
    });
  }
</script>
</body>
</html>
