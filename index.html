<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fast Pharmacy Scanner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #121212; color: #fff; padding: 12px; }
    .container { max-width: 450px; margin: 0 auto; }
    
    .scanner-box { 
      position: relative; 
      width: 100%; 
      height: 260px; 
      background: #000; 
      border-radius: 12px; 
      overflow: hidden; 
      border: 2px solid #333; 
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    .overlay { 
      position: absolute; 
      top: 15%; 
      left: 8%; 
      width: 84%; 
      height: 70%; 
      border: 2px dashed #00ff88; 
      border-radius: 8px; 
      box-shadow: 0 0 0 1000px rgba(0,0,0,0.5); 
      pointer-events: none; 
    }
    
    .status-badge { 
      text-align: center; 
      margin: 12px 0; 
      font-weight: bold; 
      font-size: 14px; 
      color: #00ff88; 
      min-height: 20px; 
    }
    
    .btn { 
      width: 100%; 
      padding: 14px; 
      border: none; 
      border-radius: 8px; 
      font-weight: bold; 
      font-size: 16px; 
      cursor: pointer; 
      transition: 0.2s; 
    }
    .btn-scan { background: #0d6efd; color: #fff; }
    .btn-scan:active { transform: scale(0.98); }
    .btn-scan:disabled { background: #555; cursor: not-allowed; }

    .form-box { background: #1e1e1e; padding: 12px; border-radius: 10px; margin-top: 12px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    label { font-size: 11px; color: #aaa; text-transform: uppercase; font-weight: 600; }
    input { 
      width: 100%; 
      padding: 8px; 
      background: #2a2a2a; 
      border: 1px solid #444; 
      border-radius: 6px; 
      color: #fff; 
      font-size: 13px; 
      margin-top: 2px; 
    }
  </style>
</head>
<body>

<div class="container">
  <div class="scanner-box">
    <video id="video" autoplay playsinline></video>
    <div class="overlay"></div>
  </div>
  
  <div id="status" class="status-badge">⚡ कॅमेरा सुरू होत आहे...</div>
  <button id="scanBtn" class="btn btn-scan" onclick="captureAndSend()">📷 Instant 1-Sec Scan</button>

  <div class="form-box">
    <div>
      <label>Product Name</label>
      <input type="text" id="prodName" placeholder="Product Name टाक किंवा रिकामे ठेव">
    </div>
    <div class="grid" style="margin-top: 8px;">
      <div>
        <label>Batch No.</label>
        <input type="text" id="batchNo" readonly placeholder="-">
      </div>
      <div>
        <label>MRP (₹)</label>
        <input type="text" id="mrp" readonly placeholder="-">
      </div>
      <div>
        <label>Mfg Date</label>
        <input type="text" id="mfgDate" readonly placeholder="-">
      </div>
      <div>
        <label>Exp Date</label>
        <input type="text" id="expDate" readonly placeholder="-">
      </div>
    </div>
  </div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
  // तुमची Deployed Web App URL
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyEQH-jw9f8lX8OQOKHGgRnwWuUMt55PYoizeABv-sCARL8IEhTh5XgP2r7Qkoo3Bnm/exec";

  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const status = document.getElementById('status');
  const scanBtn = document.getElementById('scanBtn');

  // १. बीप साउंड प्ले करण्यासाठी (Scan यशस्वी झाल्यावर)
  function playTickSound() {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1200, audioCtx.currentTime); 
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    } catch(e) {}
  }

  // २. बॅक (मागील) कॅमेरा स्टार्ट करणे
  navigator.mediaDevices.getUserMedia({ 
    video: { 
      facingMode: "environment",
      width: { ideal: 1280 },
      height: { ideal: 720 }
    } 
  })
  .then(stream => { 
    video.srcObject = stream; 
    status.innerText = "🎯 स्ट्रिप हिरव्या बॉक्समध्ये ठेवा आणि स्कॅन दाबा."; 
  })
  .catch(err => { 
    status.innerText = "❌ कॅमेरा सुरू होऊ शकला नाही. परवानगी तपासा."; 
  });

  // ३. १-सेकंद इन्स्टंट कॅप्चर आणि Apps Script OCR ला पाठवणे
  function captureAndSend() {
    status.innerText = "⚡ Scanning & Extracting...";
    scanBtn.disabled = true;

    // फॉर्म फील्ड्स रीसेट करणे
    document.getElementById('batchNo').value = "...";
    document.getElementById('mfgDate').value = "...";
    document.getElementById('expDate').value = "...";
    document.getElementById('mrp').value = "...";

    const context = canvas.getContext('2d');
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    context.drawImage(video, 0, 0, canvas.width, canvas.height);

    // इमेज आकुंचन (Fast Transfer साठी JPEG quality 0.75)
    const imageData = canvas.toDataURL('image/jpeg', 0.75);

    const payload = {
      productName: document.getElementById('prodName').value || "Auto Scanned Item",
      image: imageData
    };

    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
      scanBtn.disabled = false;

      if(data.status === "success") {
        playTickSound(); // बीप आवाज

        document.getElementById('batchNo').value = data.batch || "N/A";
        document.getElementById('mfgDate').value = data.mfg || "N/A";
        document.getElementById('expDate').value = data.exp || "N/A";
        document.getElementById('mrp').value = data.mrp || "N/A";

        status.innerText = "✅ १ सेकंदात स्कॅन झाले व Sheet मध्ये एंट्री झाली!";
      } else {
        status.innerText = "❌ Error: " + (data.message || "स्कॅन अयशस्वी");
      }
    })
    .catch(err => {
      scanBtn.disabled = false;
      status.innerText = "❌ नेटवर्क त्रुटी. पुन्हा प्रयत्न करा.";
      console.error(err);
    });
  }
</script>
</body>
</html>
